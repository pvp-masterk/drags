<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>/six - Profile (Demo)</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
:root {
  --primary: #7b2cbf;
  --primary-dark: #5a189a;
  --primary-light: rgba(123, 44, 191, 0.1);
  --secondary: #9d4edd;
  --secondary-dark: #7b2cbf;
  --text: #e8e6f3;
  --text-light: rgba(232, 230, 243, 0.7);
  --bg: #050006;
  --bg-dark: #030003;
  --card-bg: rgba(40, 15, 70, 0.34);
  --card-hover: rgba(60, 25, 90, 0.4);
  --accent: #ff4081;
  --accent-hover: #ff79a8;
  --header-height: 80px;
  --transition-fast: 0.2s ease;
  --transition-medium: 0.3s ease;
  --transition-slow: 0.5s ease;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  font-family: 'Inter', sans-serif;
  background-color: var(--bg);
  color: var(--text);
  overflow-x: hidden;
  min-height: 100vh;
  padding-top: var(--header-height);
}

/* Background glow */
.bg-layer {
  position: fixed;
  inset: -10%;
  filter: blur(28px);
  mix-blend-mode: screen;
  opacity: 0.8;
  pointer-events: none;
}
.bg-layer.one {
  background: radial-gradient(closest-side at 10% 20%, #2d004f 0%, transparent 35%), 
              radial-gradient(closest-side at 80% 80%, #45003b 0%, transparent 30%);
}
.bg-layer.two {
  background: linear-gradient(120deg, rgba(100,0,150,0.22), rgba(60,0,100,0.22));
}

/* Header */
header {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: var(--header-height);
  padding: 0 5%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  z-index: 1000;
  background: rgba(5, 0, 6, 0.95);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  transition: all var(--transition-medium);
  box-shadow: 0 2px 30px rgba(0, 0, 0, 0.1);
  border-bottom: 1px solid rgba(150, 80, 220, 0.1);
}

.logo {
  font-size: 24px;
  font-weight: 800;
  color: var(--text);
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-links {
  display: flex;
  gap: 25px;
}

.nav-links a {
  color: var(--text-light);
  text-decoration: none;
  font-weight: 500;
}

/* Profile Card */
.profile-container {
  max-width: 500px;
  margin: 30px auto;
  background: var(--card-bg);
  border-radius: 20px;
  padding: 30px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
  text-align: center;
  animation: fadeInUp 0.6s ease both;
  transition: all var(--transition-medium);
  position: relative;
  overflow: hidden;
  border: 1px solid rgba(150, 80, 220, 0.15);
  display: flex;
  flex-direction: column;
  align-items: center;
}

.profile-avatar {
  width: 120px;
  height: 120px;
  border-radius: 50%;
  border: 3px solid var(--primary);
  object-fit: cover;
  margin-bottom: 20px;
  z-index: 2;
  box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

.profile-name {
  font-size: 24px;
  font-weight: 800;
  margin-bottom: 5px;
  z-index: 2;
  color: #e0aaff;
  outline: none;
  border-bottom: 1px dashed rgba(255,255,255,0.2);
}

.profile-id {
  font-size: 18px;
  color: var(--text-light);
  margin-bottom: 10px;
  z-index: 2;
  outline: none;
}

/* Stats Section */
.stats-container {
  display: flex;
  justify-content: space-between;
  margin: 25px 0;
  width: 100%;
  z-index: 2;
}

.stat-item {
  text-align: center;
  flex: 1;
  padding: 10px 15px;
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
}

.stat-value {
  font-weight: 700;
  font-size: 18px;
  color: var(--primary);
  outline: none;
}

/* Info sections */
.info-section {
  margin-top: 24px;
  text-align: left;
  border-top: 1px solid rgba(150,80,220,0.15);
  padding-top: 18px;
  width: 100%;
  z-index: 2;
}

.section-title {
  font-weight: 700;
  font-size: 1rem;
  color: #d0b4ff;
  margin-bottom: 12px;
}

.info-item {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 0.9rem;
}

.info-label { color: #b8a6ff; opacity: 0.8; }
.info-value { color: #e0d5ff; font-weight: 500; outline: none; }

/* Badges Section */
.badge-box {
  background: rgba(255, 255, 255, 0.05);
  padding: 20px;
  border-radius: 16px;
  margin-top: 25px;
  width: 100%;
  z-index: 2;
}

.badge-container {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 15px;
}

.badge-wrapper { position: relative; display: inline-block; }
.badge-icon {
  width: 40px; height: 40px; border-radius: 10px;
  border: 2px solid rgba(255, 255, 255, 0.1);
  transition: all 0.2s; background: rgba(0, 0, 0, 0.2);
}

.badge-icon.glow { box-shadow: 0 0 10px rgba(255, 255, 255, 0.5); animation: pulseGlow 2s infinite alternate; }

.badge-tooltip {
  position: absolute; bottom: calc(100% + 10px); left: 50%;
  transform: translateX(-50%); background: rgba(30, 30, 46, 0.95);
  color: var(--text); padding: 10px; border-radius: 10px;
  font-size: 12px; opacity: 0; pointer-events: none;
  transition: 0.2s; width: max-content; z-index: 10;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.badge-wrapper:hover .badge-tooltip { opacity: 1; bottom: calc(100% + 15px); }

@keyframes rainbowGlow {
  0% { box-shadow: 0 0 8px #ff0000; border-color: #ff0000; }
  50% { box-shadow: 0 0 8px #33ff00; border-color: #33ff00; }
  100% { box-shadow: 0 0 8px #ff00aa; border-color: #ff00aa; }
}

.badge-icon.rainbow { animation: rainbowGlow 3s infinite ease-in-out; }

@keyframes pulseGlow {
  from { box-shadow: 0 0 5px rgba(255, 255, 255, 0.3); }
  to { box-shadow: 0 0 15px rgba(255, 255, 255, 0.7); }
}

.logout-btn {
  margin-top: 24px; width: 100%; padding: 12px;
  border: none; border-radius: 10px;
  background: linear-gradient(90deg, var(--primary), var(--primary-dark));
  color: #fff; font-weight: 700; cursor: pointer;
}

@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
</style>
</head>
<body>
  <div class="bg-layer one"></div>
  <div class="bg-layer two"></div>

  <header id="header">
    <a href="#" class="logo"><i class="fas fa-user-circle"></i> /six</a>
    <nav class="nav-links">
      <a href="#" class="active">Profile</a>
      <a href="#">Dashboard</a>
      <a href="#">Settings</a>
    </nav>
  </header>

  <div class="profile-container">
    <!-- Click the fields below to edit them -->
    <img id="avatar" class="profile-avatar" src="https://i.pravatar.cc/300?img=12" alt="User Avatar">
    <div id="name" class="profile-name" contenteditable="true">John Doe</div>
    <div id="user-id" class="profile-id" contenteditable="true">ID: 882194021</div>
    
    <div class="stats-container">
      <div class="stat-item">
        <div class="stat-value" id="likes-count" contenteditable="true">1,284</div>
        <div class="stat-label">Likes</div>
      </div>
      <div class="stat-item">
        <div class="stat-value" id="followers-count" contenteditable="true">542</div>
        <div class="stat-label">Followers</div>
      </div>
    </div>
    
    <div class="info-section">
      <div class="section-title">Account Information (Click to Edit)</div>
      <div class="info-item">
        <span class="info-label">Discord ID</span>
        <span class="info-value" id="discord-id" contenteditable="true">johndoe#0001</span>
      </div>
      <div class="info-item">
        <span class="info-label">Avatar URL</span>
        <span class="info-value" id="avatar-url-edit" contenteditable="true" style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">https://i.pravatar.cc/300?img=12</span>
      </div>
      <div class="info-item">
        <span class="info-label">Account Created</span>
        <span class="info-value" id="account-created" contenteditable="true">January 15, 2024</span>
      </div>
      <div class="info-item">
        <span class="info-label">Last Login</span>
        <span class="info-value" id="last-login" contenteditable="true">2 minutes ago</span>
      </div>
    </div>
    
    <div class="badge-box">
      <h4 style="margin-bottom:15px; color: #b8a6ff;">Badges</h4>
      <div id="badges-container" class="badge-container">
        <!-- Badges show by default via script -->
      </div>
    </div>
    
    <button class="logout-btn">Save Profile</button>
  </div>

<script>
  // Full Badge Definitions
  const badgeMap = {
    owner: { name: "Founder & Owner", icon: "https://cdn3.emoji.gg/emojis/8259-owner.png", description: "The original founder of /six", rarity: "Legendary", glow: true },
    dev: { name: "Developer", icon: "https://cdn3.emoji.gg/emojis/1166-partner.png", description: "/six Platform Developer", rarity: "Epic", glow: true },
    staff: { name: "Staff", icon: "https://cdn3.emoji.gg/emojis/1415-moderator.png", description: "Official /six Staff Member", rarity: "Epic", glow: true },
    vs: { name: "VS", icon: "https://cdn3.emoji.gg/emojis/4185-staff-team.png", description: "VS Rank - Highest membership level", rarity: "Legendary", glow: true },
    vsplusplus: { name: "VS++", icon: "https://cdn3.emoji.gg/emojis/5717-level-10.png", description: "VS++ Rank - VIP membership level", rarity: "Epic", glow: true },
    vsplus: { name: "VS+", icon: "https://cdn3.emoji.gg/emojis/9034-member.png", description: "VS+ Rank - Premium membership level", rarity: "Epic", glow: true },
    vsultra: { name: "VS Ultra", icon: "https://cdn3.emoji.gg/emojis/6336-level-30.png", description: "VS Ultra Rank - Elite membership level", rarity: "Epic", glow: true },
    vsg: { name: "VSG", icon: "https://cdn3.emoji.gg/emojis/3731-level-40.png", description: "VSG Rank - Advanced membership level", rarity: "Rare", glow: true },
    early: { name: "Early User", icon: "https://cdn3.emoji.gg/emojis/7549-member.png", description: "Joined in the first week of /six", rarity: "Rare", glow: false },
    verified: { name: "Verified", icon: "https://cdn3.emoji.gg/emojis/74424-partner.png", description: "Verified /six User", rarity: "Uncommon", glow: false },
    vsn: { name: "VSN", icon: "https://cdn3.emoji.gg/emojis/7463-level-20.png", description: "VSN Rank - Intermediate membership level", rarity: "Uncommon", glow: false },
    vsi: { name: "VSI", icon: "https://cdn3.emoji.gg/emojis/2139-level-5.png", description: "VSI Rank - Basic membership level", rarity: "Uncommon", glow: false }
  };

  function getRarityColor(rarity) {
    switch(rarity) {
      case "Legendary": return "#ff8c00";
      case "Epic": return "#a335ee";
      case "Rare": return "#0070dd";
      case "Uncommon": return "#1eff00";
      default: return "#ffffff";
    }
  }

  // Display ALL badges by default
  function displayAllBadges() {
    const container = document.getElementById("badges-container");
    container.innerHTML = "";
    
    Object.keys(badgeMap).forEach(key => {
      const badge = badgeMap[key];
      const wrapper = document.createElement("div");
      wrapper.className = "badge-wrapper";
      
      const img = document.createElement("img");
      img.src = badge.icon;
      img.className = `badge-icon ${badge.glow ? 'glow' : ''} ${badge.rarity === 'Legendary' ? 'rainbow' : ''}`;
      
      const tooltip = document.createElement("div");
      tooltip.className = "badge-tooltip";
      tooltip.innerHTML = `
        <strong style="color:${getRarityColor(badge.rarity)}">${badge.name}</strong><br>
        <span>${badge.description}</span>
      `;
      
      wrapper.appendChild(img);
      wrapper.appendChild(tooltip);
      container.appendChild(wrapper);
    });
  }

  // Dynamic Avatar Update
  document.getElementById('avatar-url-edit').addEventListener('input', function() {
    document.getElementById('avatar').src = this.innerText;
  });

  // Initialize
  document.addEventListener("DOMContentLoaded", () => {
    displayAllBadges();
  });
</script>
</body>
</html>
